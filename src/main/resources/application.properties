spring.application.name=${SPRING_APPLICATION_NAME:subscription-platform}
server.port=${SERVER_PORT:8080}

# ==============================
# Paystack
# ==============================
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.public-key=${PAYSTACK_PUBLIC_KEY}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:3000/payment/callback}

# ==============================
# Subscription plans
# ==============================
plan.two-hour.amount=${PLAN_TWO_HOUR_AMOUNT:200}
plan.two-hour.hours=${PLAN_TWO_HOUR_HOURS:2}

plan.three-hour.amount=${PLAN_THREE_HOUR_AMOUNT:350}
plan.three-hour.hours=${PLAN_THREE_HOUR_HOURS:3}

plan.five-hour.amount=${PLAN_FIVE_HOUR_AMOUNT:500}
plan.five-hour.hours=${PLAN_FIVE_HOUR_HOURS:5}

# ==============================
# Session / scheduler
# ==============================
session.cleanup.interval-ms=${SESSION_CLEANUP_INTERVAL_MS:30000}
account.password.length=${ACCOUNT_PASSWORD_LENGTH:10}

# ==============================
# Admin
# ==============================
admin.session.duration-hours=${ADMIN_SESSION_DURATION_HOURS:12}

referral.default-admin-share-percent=${REFERRAL_DEFAULT_ADMIN_SHARE_PERCENT:30}
referral.default-platform-share-percent=${REFERRAL_DEFAULT_PLATFORM_SHARE_PERCENT:70}

superadmin.bootstrap.username=${SUPERADMIN_BOOTSTRAP_USERNAME:superadmin@platform.com}
superadmin.bootstrap.password=${SUPERADMIN_BOOTSTRAP_PASSWORD:ChangeMe123!}

app.frontend-base-url=${APP_FRONTEND_BASE_URL:https://virtuwin-ui.vercel.app}

# ==============================
# Multipart
# ==============================
spring.servlet.multipart.enabled=${SPRING_SERVLET_MULTIPART_ENABLED:true}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:6MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:8MB}

# ==============================
# Logging
# ==============================
logging.level.com.example.subscription=${LOGGING_LEVEL_COM_EXAMPLE_SUBSCRIPTION:DEBUG}

# ==============================
# NVIDIA
# ==============================
nvidia.api-key=${NVIDIA_API_KEY}
nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
nvidia.model=${NVIDIA_MODEL:meta/llama-3.2-90b-vision-instruct}

# ==============================
# AI providers
# ==============================
ai.providers=openrouter,nvidia,huggingface
ai.attempt-timeout-seconds=${AI_ATTEMPT_TIMEOUT_SECONDS:60}

# ==============================
# Hugging Face
# ==============================
ai.huggingface.base-url=${AI_HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}
ai.huggingface.api-key=${AI_HUGGINGFACE_API_KEY}
ai.huggingface.models=${AI_HUGGINGFACE_MODELS:Qwen/Qwen2.5-VL-72B-Instruct,meta-llama/Llama-4-Scout-17B-16E-Instruct,Qwen/Qwen2.5-VL-7B-Instruct,google/gemma-3-27b-it}

# ==============================
# NVIDIA NIM
# ==============================
ai.nvidia.base-url=${AI_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
ai.nvidia.api-key=${AI_NVIDIA_API_KEY:}
# Primary vision model - 90B is more accurate for reading dense betting slip text
ai.nvidia.models=meta/llama-3.2-90b-vision-instruct,meta/llama-3.2-11b-vision-instruct
# ==============================
# Together AI
# ==============================
ai.together.base-url=${AI_TOGETHER_BASE_URL:https://api.together.xyz/v1}
ai.together.api-key=${AI_TOGETHER_API_KEY:}
ai.together.models=${AI_TOGETHER_MODELS:Qwen/Qwen2.5-VL-72B-Instruct}

# ==============================
# OpenRouter
# ==============================
ai.openrouter.base-url=${AI_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
ai.openrouter.api-keys=${AI_OPENROUTER_API_KEYS:}
ai.openrouter.models=${AI_OPENROUTER_MODELS:qwen/qwen2.5-vl-72b-instruct,google/gemini-2.0-flash-001}

# ==============================
# Image preparation
# ==============================
ai.image.max-edge-px=${AI_IMAGE_MAX_EDGE_PX:1024}
ai.image.max-base64-bytes=${AI_IMAGE_MAX_BASE64_BYTES:180000}
ai.image.jpeg-quality=${AI_IMAGE_JPEG_QUALITY:0.75}

# ==============================
# AI logging
# ==============================
logging.level.com.example.subscription.service.NvidiaAiService=${LOGGING_LEVEL_COM_EXAMPLE_SUBSCRIPTION_SERVICE_NVIDIAAISERVICE:DEBUG}

logging.level.com.example.subscription.service.NvidiaAiService.wire=${LOGGING_LEVEL_COM_EXAMPLE_SUBSCRIPTION_SERVICE_NVIDIAAISERVICE_WIRE:INFO}

ai.log.full-response=${AI_LOG_FULL_RESPONSE:false}
ai.log.request-body=${AI_LOG_REQUEST_BODY:false}
ai.log.preview-chars=${AI_LOG_PREVIEW_CHARS:400}

# ==============================
# Logging patterns
# ==============================
logging.pattern.console=${LOGGING_PATTERN_CONSOLE:%d{HH:mm:ss.SSS} %-5level [%X{scanId:-........}] %logger{36} - %msg%n}

logging.pattern.file=${LOGGING_PATTERN_FILE:%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{scanId:-........}] %logger{36} - %msg%n}

# Optional
# logging.file.name=${LOGGING_FILE_NAME:logs/predator-scan.log}

# ==============================
# Cerebras
# ==============================
ai.cerebras.api-key=${AI_CEREBRAS_API_KEY}

# ==============================
# Gemini
# ==============================
ai.gemini.api-keys=${AI_GEMINI_API_KEYS:}


# ==============================
# Akwapay
# ==============================
app.akwapay.secret-key=${APP_AKWAPAY_SECRET_KEY}
app.akwapay.webhook-secret.scan=${APP_AKWAPAY_WEBHOOK_SECRET_SCAN}
app.akwapay.webhook-secret.subscription=${APP_AKWAPAY_WEBHOOK_SECRET_SUBSCRIPTION}
app.akwapay.base-url=${APP_AKWAPAY_BASE_URL:https://akwapayapi.onrender.com/v1}

# ==============================
# Platform frontend
# ==============================
app.platform.frontend-url=${APP_PLATFORM_FRONTEND_URL:https://virtuwin-ui.vercel.app}